# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true

## Environment Properties

minecraft_version=1.20.1
# Fabric Loom 1.7 runs on Gradle 8.8 (the wrapper's version).
loom_version=1.7.4
loader_version=0.17.2
fabric_api_version=0.92.6+1.20.1

# Create Fabric 6.0.7; its POM pins Porting Lib 2.3.10+1.20.1, Registrate-Fabric 1.3.79-MC1.20.1,
# Flywheel-Fabric 1.0.0-217, Ponder-Fabric 1.0.80 and Forge Config API Port 8.0.0, which come in transitively.
create_version=6.0.7.0+mc1.20.1-build.1716
jei_version=15.20.0.106
modmenu_version=7.2.2

# Dependency ranges for fabric.mod.json.
minecraft_dependency=~1.20.1
loader_dependency=>=0.15
create_dependency=>=6.0.7 <6.1

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
mod_id=brewery
# The human-readable display name for the mod.
mod_name=Create Brewery
# The license of the mod.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=0.2.0+mc1.20.1-fabric
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
mod_group_id=com.kostya.createbrewery
