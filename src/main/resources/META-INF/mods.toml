# Forge mods.toml for Create Brewery on Minecraft 1.20.1.
# The overall format is standard TOML format, v0.5.0.

# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory

# A version range to match for said mod loader - for regular FML @Mod it will be the Forge version
loaderVersion="${loader_version_range}" #mandatory

# The license for you mod.
license="${mod_license}"

# A URL to refer people to when problems occur with this mod
issueTrackerURL="https://github.com/onkos1412/create-brewery/issues" #optional

[[mods]] #mandatory

# The modid of the mod
modId="${mod_id}" #mandatory

# The version number of the mod
version="${mod_version}" #mandatory

# A display name for the mod
displayName="${mod_name}" #mandatory

# A URL for the "homepage" for this mod, displayed in the mod UI
displayURL="https://github.com/onkos1412/create-brewery" #optional

# A file name (in the root of the mod JAR) containing a logo for display
logoFile="brewery_logo.png" #optional

# A text field displayed in the mod UI
credits="Inspired by the BreweryX plugin. Built on Create by the Creators of Create." #optional

# The authors of the mod, displayed in the mod UI
authors="Kostya"

# The description text for the mod (multi line!) (#mandatory)
description='''
Brew, distill and age drinks with Create machines.
Any mix brews in the kettle - find the recipes yourself. Quality from 1 to 5 stars, drink effects,
drunkenness, staggering, throwing up and hangovers. Perfect automation gives perfect drinks.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Create dependency - this mod is a Create addon and requires Create at runtime.
[[dependencies.${mod_id}]]
    modId="create"
    mandatory=true
    versionRange="${create_version_range}"
    ordering="NONE"
    side="BOTH"

# JEI may be installed alongside; the mod adds no recipe pages to it, since recipes are found by experimenting.
[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="[15,)"
    ordering="NONE"
    side="CLIENT"
