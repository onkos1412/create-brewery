plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    // The jar says what it is next to Create's own, unlike the bare mod id.
    archivesName = "create-brewery"
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

loom {
    // brewery.mixins.json names this refmap; Loom generates it.
    mixin.defaultRefmapName = "${mod_id}.refmap.json"

    runs {
        // A dedicated server that runs every registered game test, writes a JUnit report and exits
        // (non-zero when a test fails). Started by `runGametest`.
        gametest {
            server()
            name = "Game Test"
            vmArg "-Dfabric-api.gametest"
            // Only this mod's game tests: Create Fabric registers its own through the same entrypoint.
            vmArg "-Dbrewery.gametest.namespaces=${mod_id}"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('gametest.xml').get().asFile.absolutePath}"
            // Create Fabric 6.0.7 build 1716 registers its client-only CardboardArmorStealthOverlay from common
            // code (AllItems, cardboard_helmet). Verifying that class loads LocalPlayer, which Fabric Loader refuses
            // on a server, so Create's own initializer fails. Skipping bytecode verification of mod classes keeps
            // LocalPlayer unloaded; the overlay is never ticked on a server.
            vmArg "-XX:+UnlockDiagnosticVMOptions"
            vmArg "-XX:-BytecodeVerificationRemote"
            runDir "build/gametest"
        }
    }
}

// Run the game on the Java 17 toolchain, as players do.
tasks.withType(net.fabricmc.loom.task.AbstractRunTask).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }

    // Loom only writes its classpath argument file when the project path is ASCII. Otherwise Gradle passes
    // the long Windows classpath through a pathing jar, and Fabric Loader, which reads java.class.path
    // directly, cannot find the game there. The java launcher reads argument files in the platform
    // encoding, so write one in that encoding (it holds Cyrillic on a Russian Windows).
    doFirst {
        if (!java.nio.charset.StandardCharsets.US_ASCII.newEncoder().canEncode(project.projectDir.absolutePath)) {
            def charset = java.nio.charset.Charset.forName(System.getProperty('sun.jnu.encoding', 'UTF-8'))
            def path = classpath.files.collect { it.absolutePath.replace('\\', '/') }.join(File.pathSeparator)
            def argFile = new File(temporaryDir, 'classpath.args')
            argFile.setText("-cp \"${path}\"", charset.name())
            jvmArgs "@${argFile.absolutePath}"
            classpath = project.files()
        }
    }
}

repositories {
    // Gradle's own client times out fetching the JEI jars from BlameJared on some networks,
    // so a copy placed in ~/.m2 by hand wins; everyone else gets them from the repository below.
    mavenLocal {
        content { includeGroup 'mezz.jei' }
    }
    maven {
        // Create Fabric, Registrate-Fabric, Milk Lib
        name = 'devos snapshots'
        url = 'https://mvn.devos.one/snapshots'
    }
    maven {
        // Porting Lib
        name = 'devos releases'
        url = 'https://mvn.devos.one/releases'
    }
    maven {
        // Flywheel and Ponder
        name = 'Create Mod'
        url = 'https://maven.createmod.net'
    }
    maven {
        // Registrate
        name = 'tterrag'
        url = 'https://maven.tterrag.com'
    }
    maven {
        // Forge Config API Port
        name = 'Fuzs Mod Resources'
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven'
        content { includeGroup 'fuzs.forgeconfigapiport' }
    }
    maven {
        // Reach Entity Attributes
        name = 'Jamieswhiteshirt'
        url = 'https://maven.jamieswhiteshirt.com/libs-release'
        content { includeGroup 'com.jamieswhiteshirt' }
    }
    maven {
        // JEI
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    mavenCentral()
}

// Minimal JUnit 5 setup so the plain-Java unit tests in `src/test/java` run with `build`.
configurations {
    junitConsole
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Official names keep the code identical to the Forge branch.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Create addon dependency. Create Fabric brings Porting Lib, Registrate, Flywheel, Ponder and
    // Forge Config API Port transitively, at exactly the versions its POM pins.
    modImplementation "com.simibubi.create:create-fabric-${minecraft_version}:${create_version}"

    // JEI is optional: the API is compile time only, and the full mod runs only in this workspace.
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    modLocalRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    junitConsole platform('org.junit:junit-bom:5.10.2')
    junitConsole 'org.junit.platform:junit-platform-console'
}

// The unit tests run through a plain forked JVM with the JUnit Platform console launcher,
// as on the Forge build, so they never depend on how the mod plugin sets up Gradle's
// test executor. `test`, `check` and `build` all run them.
def testTask = tasks.register('runUnitTests', JavaExec) {
    group = 'verification'
    description = 'Runs the plain-Java JUnit tests on src/test/java in a forked JVM.'
    dependsOn tasks.named('testClasses')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath + configurations.junitConsole
    mainClass = 'org.junit.platform.console.ConsoleLauncher'
    args 'execute', '--fail-if-no-tests', '--scan-classpath', sourceSets.test.output.classesDirs.singleFile.absolutePath
}

tasks.named('test') {
    dependsOn testTask
    enabled = false
}
tasks.named('check') { dependsOn testTask }
tasks.named('build') { dependsOn testTask }

// Expands the declared properties in fabric.mod.json.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            minecraft_dependency: minecraft_dependency,
            loader_dependency   : loader_dependency,
            create_dependency   : create_dependency,
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        // Keep JSON escapes, such as the line break in the description, as they are.
        expand(replaceProperties) { escapeBackslash = true }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.release = 17
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
