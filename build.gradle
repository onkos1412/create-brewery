plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version
group = mod_group_id

base {
    // The jar says what it is next to Create's own, unlike the bare mod id.
    archivesName = "create-brewery"
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Copy resources into the run classpath so the IDE runs see them like Gradle's own runs do.
    copyIdeResources = true

    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file("run/${it.name}")

            // "REGISTRIES": For firing of registry events.
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Create, Flywheel and Ponder ship SRG-named mixins: remap their refmaps to the
            // official names this workspace runs with.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // Launches GameTestServer, runs all registered game tests, then exits.
        // The server crashes when no game tests are registered.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Gradle's own client times out fetching the JEI jars from BlameJared on some networks,
    // so a copy placed in ~/.m2 by hand wins; everyone else gets them from the repository below.
    mavenLocal {
        content { includeGroup 'mezz.jei' }
    }
    maven {
        // Create and its related mods (Ponder, Flywheel)
        name = 'Create Mod'
        url = 'https://maven.createmod.net'
    }
    maven {
        // Registrate
        name = 'tterrag'
        url = 'https://maven.tterrag.com'
        content { includeGroup 'com.tterrag.registrate' }
    }
    maven {
        // JEI
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    mavenCentral()
}

// Minimal JUnit 5 setup so the plain-Java unit tests in `src/test/java` run with `build`.
configurations {
    junitConsole
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Create addon dependency. Create itself is pulled in as a slim (non-transitive) jar,
    // with the companion libraries it bundles (jar-in-jar) declared explicitly below.
    // The 1.20.1 jars are SRG-named, so they go through fg.deobf.
    implementation fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")
    // Create's mixins use MixinExtras, which Forge 47 does not ship.
    runtimeOnly "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"

    // JEI is optional: the API is compile time only, and the full mod runs only in this workspace.
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    junitConsole platform('org.junit:junit-bom:5.10.2')
    junitConsole 'org.junit.platform:junit-platform-console'
}

// The unit tests run through a plain forked JVM with the JUnit Platform console launcher,
// as on the 1.21.1 build, so they never depend on how the mod plugin sets up Gradle's
// test executor. `test`, `check` and `build` all run them.
def testTask = tasks.register('runUnitTests', JavaExec) {
    group = 'verification'
    description = 'Runs the plain-Java JUnit tests on src/test/java in a forked JVM.'
    dependsOn tasks.named('testClasses')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    classpath = sourceSets.test.runtimeClasspath + configurations.junitConsole
    mainClass = 'org.junit.platform.console.ConsoleLauncher'
    args 'execute', '--fail-if-no-tests', '--scan-classpath', sourceSets.test.output.classesDirs.singleFile.absolutePath
}

tasks.named('test') {
    dependsOn testTask
    enabled = false
}
tasks.named('check') { dependsOn testTask }
tasks.named('build') { dependsOn testTask }

// Expands the declared properties in mods.toml.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            create_version_range   : create_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : 'Kostya',
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : 'Kostya'
        ])
    }

    // Reobfuscates the jar to SRG names, the form a 1.20.1 Forge release must have.
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
